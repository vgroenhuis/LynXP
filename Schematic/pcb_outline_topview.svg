<text x="510" y="321.0" text-anchor="start" fill="#c92a2a" font-size="13" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">30 mm</text>
<line x1="392.0" y1="324.0" x2="392.0" y2="432" stroke="none"/>
<text x="450" y="173.6" text-anchor="middle" fill="#212529" font-size="15" font-weight="bold">PCB (160 × 90 mm, chamfered corners)</text>
<text x="450" y="192.6" text-anchor="middle" fill="#212529" font-size="13">tall parts, OLED, potentiometer, buttons,</text>
<text x="450" y="209.6" text-anchor="middle" fill="#212529" font-size="13">switches, vertical connectors go here</text>
<text x="450" y="546.0" text-anchor="middle" fill="#495057" font-size="14">no PCB (outside the board outline, inside the 190 mm circle)</text>
<rect x="40" y="736" width="34" height="20" fill="#495057" stroke="#212529" stroke-width="2"/>
<text x="88" y="751" fill="#212529" font-size="14">Wheels (Ø 71 × 5 mm) outside the 160 mm edges (3 mm assumed; corners 94.9 mm from the centre)</text>
<rect x="40" y="766" width="34" height="20" fill="#d3f9d8"/>
<rect x="40" y="766" width="34" height="20" fill="url(#hBlue)" stroke="#1c4f8f" stroke-width="2"/>
<text x="88" y="781" fill="#212529" font-size="14">Drive motors (Ø 37 mm: 55 × 37 mm from above): the PCB can still go over them</text>
<rect x="40" y="796" width="34" height="20" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
<text x="88" y="811" fill="#212529" font-size="14">PCB area: 160 × 90 mm rectangle with 55 × 42 mm chamfers, straight edge through the robot centre</text>
<rect x="40" y="826" width="34" height="20" fill="#d3f9d8"/>
<rect x="40" y="826" width="34" height="20" fill="url(#hOrange)" stroke="#e8590c" stroke-width="2"/>
<text x="88" y="841" fill="#212529" font-size="14">Ø 70 mm: the PCB is still there; only low parts (no tall parts, no vertical connectors), the pan/tilt platform rotates just above</text>
<rect x="40" y="856" width="34" height="20" fill="url(#hRed)" stroke="#c92a2a" stroke-width="2"/>
<text x="88" y="871" fill="#212529" font-size="14">30 × 30 mm cut-out for the pan servo (half of it lies outside the board edge)</text>
<rect x="40" y="886" width="34" height="20" fill="url(#hGrey)" stroke="#1971c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="88" y="901" fill="#212529" font-size="14">Ø 190 mm circle: nothing of the PCB may extend beyond it</text>
<text x="40" y="930" fill="#495057" font-size="13">Which half of the robot the board covers (front or rear) follows from the frame and the powerbank position; the mirrored layout is equally valid.</text>
</svg>