# The robot's web pages as a demo without a robot (a simulated robot and
# camera: Firmware/Robot_ESP32_C5_IDF/tools/web_demo), on GitHub Pages:
# https://vgroenhuis.github.io/LynXP/ -- rebuilt on every change to the pages.
# (Once, in the repository's Settings > Pages: Source "GitHub Actions".)
name: Web demo

on:
  push:
    branches: [main]
    paths:
      - "Firmware/Robot_ESP32_C5_IDF/main/littlefs_image/**"
      - "Firmware/Robot_ESP32_C5_IDF/tools/web_demo/**"
      - ".github/workflows/web-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # (a deployment under way finishes; the next one waits)

jobs:
  # (two jobs, as in GitHub's own Pages workflows: the site's upload is
  # finished and listed before the deploy looks for it -- in one job the
  # deploy sometimes found no "github-pages" artifact yet)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo site
        run: python3 Firmware/Robot_ESP32_C5_IDF/tools/web_demo/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
