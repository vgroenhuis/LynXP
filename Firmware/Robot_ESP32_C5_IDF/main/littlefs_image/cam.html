<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LynXP first-person view</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="cam-body">
  <div class="cam-rotate-prompt">Rotate your device to landscape to enable controls.</div>
  <div class="cam-fullscreen">
    <img id="camStream" alt="Camera stream">
    <canvas id="camFloorGrid" class="cam-floor-grid" style="display:none"></canvas>
    <canvas id="camAxesOverlay" class="cam-floor-grid" style="display:none"></canvas>
    <canvas id="camWaypointOverlay" class="cam-floor-grid" style="display:none"></canvas>
    <canvas id="camFireballOverlay" class="cam-floor-grid" style="display:none"></canvas>
    <details class="cam-menu-panel" id="camMenuPanel" open>
      <summary>Menu</summary>
      <div class="cam-menu-panel-body">
        <label class="cam-mode-label">Game / app
          <select id="camModeSelect" class="cam-mode-select"></select>
        </label>
        <button id="camDriveModeBtn" class="cam-overlay-btn" style="display:none"></button>
        <button id="camStickReadoutBtn" class="cam-overlay-btn">🎮 Stick readout</button>
        <a href="/" class="cam-overlay-btn">Main</a>
        <a href="/games" class="cam-overlay-btn">Games &amp; apps settings</a>
        <button id="camFullscreenBtn" class="cam-overlay-btn">Fullscreen</button>
        <button id="camReloadBtn" class="cam-overlay-btn">Reload page</button>
        <a id="camSettingsLink" href="#" target="_blank" rel="noopener" class="cam-overlay-btn" style="display:none">Cam settings</a>
        <div id="gamepadStatus" class="cam-gamepad-status"></div>
      </div>
    </details>
    <button id="camFireballBtn" class="cam-overlay-btn cam-fireball-btn" style="display:none">🔥 Fire</button>
    <details class="cam-menu-panel cam-menu-panel-right" id="camOverlaysPanel" open>
      <summary>Overlays</summary>
      <div class="cam-menu-panel-body">
        <label class="cam-toggle-switch">
          <input type="checkbox" id="camToggleMapOverlay">
          <span class="cam-toggle-slider"></span>
          Map
        </label>
        <label class="cam-toggle-switch">
          <input type="checkbox" id="camToggleFloorGrid">
          <span class="cam-toggle-slider"></span>
          Floor grid
        </label>
        <label class="cam-toggle-switch">
          <input type="checkbox" id="camToggleWorldAxes">
          <span class="cam-toggle-slider"></span>
          World axes
        </label>
        <label class="cam-toggle-switch">
          <input type="checkbox" id="camToggleWaypoints">
          <span class="cam-toggle-slider"></span>
          Waypoints
        </label>
        <button id="camSetHomeBtn" class="cam-overlay-btn">Set position as home</button>
      </div>
    </details>
    <canvas id="camMapOverlay" class="cam-map-overlay" width="160" height="160" style="display:none"></canvas>
    <div id="cam-status" class="cam-status"></div>
    <div id="camLeftJoystickBase" class="cam-floating-joystick-base" style="display:none">
      <div id="camLeftJoystickKnob" class="cam-floating-joystick-knob"></div>
    </div>
    <div id="camRightJoystickBase" class="cam-floating-joystick-base cam-floating-joystick-base-right" style="display:none">
      <div id="camRightJoystickKnob" class="cam-floating-joystick-knob"></div>
    </div>
  </div>
  <script src="lynx_common.js"></script>
  <script src="controls.js"></script>
  <script src="ar.js"></script>
  <script src="weapons_kit.js"></script>
  <script src="game_demons.js"></script>
  <script src="game_david.js"></script>
  <script src="game_poop.js"></script>
  <script src="game_coins.js"></script>
  <script src="prisma_core.js"></script>
  <script src="prisma_levels.js"></script>
  <script src="game_prisma.js"></script>
  <script src="game_temple.js"></script>
  <script src="game_temple_sanctum.js"></script>
  <script src="game_temple_labyrinth.js"></script>
  <script src="game_temple_kit.js"></script>
  <script src="game_temple_sky.js"></script>
  <script src="game_temple_cistern.js"></script>
  <script src="game_temple_mirrors.js"></script>
  <script src="game_temple_vault.js"></script>
  <script src="world3d.js"></script>
  <script src="game_knight.js"></script>
  <script src="tagblocks.js"></script>
  <script src="freedrive_tags.js"></script>
  <script src="game_knightblocks.js"></script>
  <script src="game_race.js"></script>
  <script src="detect.js"></script>
  <script src="camcal_solver.js"></script>
  <script src="camext_solver.js"></script>
  <script src="camservo.js"></script>
  <script src="app_camservo.js"></script>
  <script src="app_camcal.js"></script>
  <script src="app_focus.js"></script>
  <script src="cam.js"></script>
</body>
</html>
